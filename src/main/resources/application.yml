spring:

  application:
    name: career-radar

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/career_radar}
    username: ${DB_USERNAME:career_radar}
    password: ${DB_PASSWORD:career_radar}
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

server:
  port: 3107