services:

  postgres:
    image: postgres:17-bookworm
    container_name: career-radar-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: career_radar
      POSTGRES_USER: career_radar
      POSTGRES_PASSWORD: career_radar

    ports:
      - "5433:5432"

    volumes:
      - career-radar-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U career_radar -d career_radar"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  career-radar-postgres-data: